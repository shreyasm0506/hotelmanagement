<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your Grand Stay account.">
    <title>Log in | Grand Stay</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-mode">

    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                grand<span>stay.</span>
            </a>

            <div class="header-actions">
                <a href="index.html" class="btn btn-secondary">
                    Back to Home
                </a>
                <button id="theme-toggle" class="theme-toggle" type="button">
                    <span id="theme-icon">Light</span>
                </button>
            </div>
        </div>
    </header>

    <main class="booking-page">
        <section class="booking-form-section">
            <p class="section-label">WELCOME BACK</p>
            <h1>Log in</h1>
            <p>
                Log in to book a room and manage your stays.
            </p>

            <form id="auth-form" class="auth-form" novalidate>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <button type="submit" class="btn" id="auth-submit">
                    Log in
                </button>

                <p id="auth-message" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-switch">
                New to Grand Stay? <a id="register-link" href="register.html">Create an account</a>
            </p>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="theme.js"></script>
    <script src="login.js"></script>
</body>

</html>
