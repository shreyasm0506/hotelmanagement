spring.application.name=hotel_management

# Database (set these as environment variables; never commit real values)
# DB_URL examples (the driver is chosen from the URL):
#   MySQL:      jdbc:mysql://HOST:PORT/DBNAME?sslMode=REQUIRED
#   PostgreSQL: jdbc:postgresql://HOST:PORT/DBNAME?sslmode=require
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# Hosting platforms provide the port to listen on in PORT
server.port=${PORT:8080}

# Login tokens. AUTH_SECRET must be 32+ characters. If it is not set, a random
# secret is generated at startup (everyone is logged out on each restart).
app.auth.secret=${AUTH_SECRET:}
app.auth.token-ttl-hours=8

# Websites allowed to call this API (comma separated, no trailing slash).
# Local default is VS Code Live Server. When deployed, set CORS_ORIGINS to
# your frontend's URL, for example https://hotel-site.netlify.app
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
